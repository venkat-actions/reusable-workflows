name: common-cicd
on:
  workflow_call:
    inputs:
      project:
        required: true 
        type: string
      component:
        required: true 
        type: string 
      app_type:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true 
      AWS_SECRET_ACCESS_KEY:
        required: true
      
jobs:
  ci:
    runs-on: self-hosted
    outputs:
      appVersion: ${{ steps.package-version.outputs.version }}
    steps:
      - name: checkout the code 
        uses: actions/checkout@v6
      - name: Display the files
        run: ls -ltr

      - name: Read version of package.json
        id: package-version
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Print app version
        run: echo "appVersion is ${{ steps.package-version.outputs.version }}"
      - name: install dependencies
        run: npm install

      - name: docker build
        run: docker build -t 747639505780.dkr.ecr.us-east-1.amazonaws.com/roboshop/catalogue:${{ steps.package-version.outputs.version }} .
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: docker push
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 747639505780.dkr.ecr.us-east-1.amazonaws.com
          docker push 747639505780.dkr.ecr.us-east-1.amazonaws.com/roboshop/catalogue:${{ steps.app-version.outputs.version }}
