name: common-cicd
on:
  workflow_call:
    inputs:
      project:
        required: true 
        type: string
      component:
        required: true 
        type: string 
      app_type:
        required: true
        type: string
jobs:
  ci:
    runs-on: self-hosted
    outputs:
      appVersion: ${{ steps.package-version.outputs.version }}
    steps:
      - name: checkout the code 
        uses: actions/checkout@v6
      - name: Display the files
        run: ls -ltr

      - name: Read version of package.json
        id: package-version
        run: echo "version =$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Print app version
        run: echo ${{ steps.package-version.outputs.version }}
        
